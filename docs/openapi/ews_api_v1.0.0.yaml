          minLength: 1
        rel:
          type: string
        type:
          type: string
        title:
          type: string
    FeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        timeStamp:
          type: string
          format: date-time
        numberMatched:
          type: integer
          minimum: 0
        numberReturned:
          type: integer
          minimum: 0
    Collection:
      type: object
      required:
        - id
        - links
      properties:
        id:
          const: alerts
        title:
          type: string
        description:
          type: string
        itemType:
          const: feature
        links:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Link"
        extent:
          type: object
        crs:
          type: array
          items:
            type: string
    OgcException:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
        description:
          type: string
    AreaFilter:
      type: object
      minProperties: 1
      properties:
        areaDesc:
          type: string
          minLength: 1
        geocode:
          anyOf:
            - $ref: "#/components/schemas/GeoCode"
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/GeoCode"
        polygon:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s+-?\d+(\.\d+)?,-?\d+(\.\d+)?){3,}\s*$
    AlertFilter:
      type: object
      minProperties: 1
      properties:
        event:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        event_code:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - CW
              - DR
              - EW
              - EP
              - ET
              - FR
              - FF
              - FL
              - HW
              - IN
              - LS
              - MS
              - OT
              - ST
              - AV
              - SS
              - AC
              - TC
              - TS
              - VO
              - WF
        category:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Category"
        severity:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Extreme
              - Severe
              - Moderate
              - Minor
              - Unknown
        urgency:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Immediate
              - Expected
              - Future
              - Past
              - Unknown
        certainty:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Observed
              - Likely
              - Possible
              - Unlikely
              - Unknown
        threshold_status:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - NORMAL
              - WATCH
              - CROSSING_THRESHOLD_1
              - TRIGGER
        status:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Actual
              - Exercise
              - System
              - Test
              - Draft
        msg_type:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Alert
              - Update
              - Cancel
              - Ack
              - Error
        area:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AreaFilter"
    SubscribeCriteria:
      type: object
      required:
        - filter
        - notify_record_type
      properties:
        version:
          $ref: "#/components/schemas/Version"
        reg_type:
          $ref: "#/components/schemas/RegType"
        frequency:
          $ref: "#/components/schemas/Frequency"
        filter:
          $ref: "#/components/schemas/AlertFilter"
        notify_record_type:
          $ref: "#/components/schemas/RegRecordType"
    SubscribeRequest:
      type: object
      required:
        - transaction_id
        - subscribe_request
      properties:
        transaction_id:
          $ref: "#/components/schemas/TransactionId"
        subscribe_request:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - reference_id
              - timestamp
              - subscribe_criteria
            properties:
              reference_id:
                $ref: "#/components/schemas/ReferenceId"
              timestamp:
                type: string
                format: date-time
              subscribe_criteria:
                $ref: "#/components/schemas/SubscribeCriteria"
              locale:
                $ref: "#/components/schemas/Locale"
    Subscription:
      type: object
      required:
        - code
        - status
        - timestamp
      properties:
        version:
          $ref: "#/components/schemas/Version"
        code:
          $ref: "#/components/schemas/SubscriptionCode"
        status:
          type: string
          enum:
            - subscribe
            - unsubscribe
        timestamp:
          type: string
          format: date-time
        reg_type:
          $ref: "#/components/schemas/RegType"
        frequency:
          $ref: "#/components/schemas/Frequency"
        filter:
          $ref: "#/components/schemas/AlertFilter"
        notify_record_type:
          $ref: "#/components/schemas/RegRecordType"
        locale:
          $ref: "#/components/schemas/Locale"
    SubscribeResponse:
      type: object
      required:
        - transaction_id
        - correlation_id
        - subscribe_response
      properties:
        transaction_id:
          $ref: "#/components/schemas/TransactionId"
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"
        subscribe_response:
          type: array
          items:
            type: object
            required:
              - reference_id
              - timestamp
              - status
            properties:
              reference_id:
                $ref: "#/components/schemas/ReferenceId"
              timestamp:
                type: string
                format: date-time
              status:
                $ref: "#/components/schemas/RequestStatus"
              status_reason_code:
                type: string
                enum:
                  - rjct.reference_id.invalid
                  - rjct.reference_id.duplicate
                  - rjct.timestamp.invalid
                  - rjct.notify_types.invalid
                  - rjct.notify_details.invalid
                  - rjct.filter.invalid
                  - rjct.event.already_subscribed
              status_reason_message:
                $ref: "#/components/schemas/StatusReasonMessage"
              subscriptions:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
              locale:
                $ref: "#/components/schemas/Locale"
    UnSubscribeRequest:
      type: object
      required:
        - transaction_id
        - timestamp
        - subscription_codes
      properties:
        transaction_id:
          $ref: "#/components/schemas/TransactionId"
        timestamp:
          type: string
          format: date-time
        subscription_codes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SubscriptionCode"
    UnSubscribeResponse:
      type: object
      required:
        - transaction_id
        - correlation_id
        - timestamp
        - status
      properties:
        transaction_id:
          $ref: "#/components/schemas/TransactionId"
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"
        timestamp:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/RequestStatus"
        status_reason_code:
          type: string
          enum:
            - rjct.reference_id.invalid
            - rjct.reference_id.duplicate
            - rjct.timestamp.invalid
            - rjct.subscription_code.invalid
            - rjct.requester.invalid
            - rjct.event.already_unsubscribed
        status_reason_message:
          $ref: "#/components/schemas/StatusReasonMessage"
        subscription_status:
          type: array
          items:
            type: object
            required:
              - code
              - status
            properties:
              code:
                $ref: "#/components/schemas/SubscriptionCode"
              status:
                type: string
                enum:
                  - subscribe
                  - unsubscribe
    NotifyData:
      type: object
      required:
        - reg_record_type
        - reg_records
      properties:
        version:
          $ref: "#/components/schemas/Version"
        reg_type:
          $ref: "#/components/schemas/RegType"
        reg_event_type:
          type: string
          minLength: 1
        reg_record_type:
          $ref: "#/components/schemas/RegRecordType"
        reg_records:
          type:
            - array
            - object
      allOf:
        - if:
            properties:
              reg_record_type:
                pattern: ^([A-Za-z0-9_.-]+:)*(CapAlert|Cap_Alert)$
            required:
              - reg_record_type
          then:
            properties:
              reg_records:
                anyOf:
                  - type: array
                    minItems: 1
                    items:
                      $ref: "#/components/schemas/CapAlert"
                  - $ref: "#/components/schemas/CapAlert"
        - if:
            properties:
              reg_record_type:
                pattern: ^([A-Za-z0-9_.-]+:)*Alert$
            required:
              - reg_record_type
          then:
            properties:
              reg_records:
                anyOf:
                  - type: array
                    minItems: 1
                    items:
                      $ref: "#/components/schemas/Alert"
                  - $ref: "#/components/schemas/Alert"
    NotifyEventRequest:
      type: object
      required:
        - transaction_id
        - notify_event
      properties:
        transaction_id:
          $ref: "#/components/schemas/TransactionId"
        notify_event:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - reference_id
              - timestamp
              - data
            properties:
              reference_id:
                $ref: "#/components/schemas/ReferenceId"
              timestamp:
                type: string
                format: date-time
              data:
                $ref: "#/components/schemas/NotifyData"
              locale:
                $ref: "#/components/schemas/Locale"
    SdmxValue:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
    SdmxDimension:
      type: object
      required:
        - id
        - values
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
        keyPosition:
          type: integer
          minimum: 0
        role:
          type: string
        values:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SdmxValue"
    SdmxObservationValue:
      type:
        - integer
        - "null"
      minimum: 0
    SdmxJson:
      type: object
      required:
        - structure
        - dataSets
      properties:
        header:
          type: object
          required:
            - id
            - prepared
            - sender
          properties:
            id:
              type: string
              minLength: 1
            prepared:
              type: string
              format: date-time
            sender:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  minLength: 1
        structure:
          type: object
          required:
            - dimensions
            - measures
          properties:
            name:
              type: string
            dimensions:
              type: object
              required:
                - series
              properties:
                series:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/SdmxDimension"
                observation:
                  type: array
                  items:
                    $ref: "#/components/schemas/SdmxDimension"
            measures:
              type: object
              required:
                - series
              properties:
                series:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        const: OBS_VALUE
                      name:
                        type: string
                      unit:
                        type: string
        dataSets:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - series
            properties:
              action:
                type: string
                enum:
                  - Information
                  - Append
                  - Replace
                  - Delete
              attributes:
                type: object
              series:
                type: object
                propertyNames:
                  pattern: ^\d+(:\d+)*$
                additionalProperties:
                  type: object
                  required:
                    - observations
                  properties:
                    attributes:
                      type: object
                    observations:
                      type: object
                      minProperties: 1
                      propertyNames:
                        pattern: ^\d+$
                      additionalProperties:
                        type: array
                        minItems: 1
                        items:
                          - $ref: "#/components/schemas/SdmxObservationValue"
    DciStatistics:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          type: object
          required:
            - id
            - prepared
            - sender
          properties:
            schema:
              type: string
            id:
              type: string
              minLength: 1
            prepared:
              type: string
              format: date-time
            sender:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  minLength: 1
            receiver:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  minLength: 1
        data:
          type: object
          required:
            - dataSets
          properties:
            dataSets:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - structureRef
                  - observations
                properties:
                  action:
                    type: string
                    enum:
                      - Information
                      - Append
                      - Replace
                      - Delete
                  structureRef:
                    const: DCI_MEMBER_STATISTICS
                  attributes:
                    type: object
                  observations:
                    type: object
                    propertyNames:
                      pattern: ^[^.]+(\.[^.]+){3,5}$
                    additionalProperties:
                      type: object
                      required:
                        - OBS_VALUE
                      properties:
                        OBS_VALUE:
                          $ref: "#/components/schemas/SdmxObservationValue"
    AckResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: object
          required:
            - ack_status
            - timestamp
            - correlation_id
          properties:
            ack_status:
              type: string
              enum:
                - ACK
                - NACK
                - ERR
            timestamp:
              type: string
              format: date-time
            error:
              $ref: "#/components/schemas/Error"
            correlation_id:
              $ref: "#/components/schemas/CorrelationId"
          if:
            properties:
              ack_status:
                const: ERR
            required:
              - ack_status
          then:
            required:
              - error
            properties:
              error:
                required:
                  - code
    HttpErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - code
            properties:
              code:
                type: string
                minLength: 1
              message:
                type: string
