# DERIVED by EWS-Mockup-Compliance (mock/generate-openapi.mjs) from the DCI EWS standard pages:
# the standard publishes no OpenAPI YAML. Do not edit by hand.
openapi: 3.1.0
info:
  title: DCI Early Warning System (EWS) interface
  version: 1.0.0
  description: |-
    Interface between an Early Warning System (EWS) and a Social Protection (SP) system, per the
    [DCI Early Warning Systems standard](https://standards.spdci.org/standards/dci-standards/early-warning-systems).

    **Derived description.** The standard publishes no OpenAPI YAML for EWS. This document is generated by the
    EWS-Mockup-Compliance suite from the standard pages and the suite's schemas. Subscribe and notify use the DCI
    message envelope shared by every DCI API, since the standard publishes none for them.

    - API.EWS.01 Event subscription: `/subscribe`, `/unsubscribe` (EWS side) and their callbacks (SP side)
    - API.EWS.02 Event notification: `/notify` (SP side, EWS -> SP)
    - API.EWS.03 Fetch alert and API.EWS.04 Create-replace: `/collections/alerts` (EWS side, OGC API Features)
    - API.EWS.05 Aggregated member statistics: `/data/{dataflow}/{key}` (SP side, SDMX)
servers:
  - url: https://ews.example.org
    description: Early Warning System
tags:
  - name: Subscription
    description: API.EWS.01
  - name: Notification
    description: API.EWS.02
  - name: Alerts
    description: API.EWS.03, API.EWS.04 (OGC API Features)
  - name: Statistics
    description: API.EWS.05, PRS.EWS.02 (SDMX)
paths:
  /subscribe:
    post:
      tags:
        - Subscription
      summary: Subscribe to alerts by event type, severity, area...
      operationId: subscribe
      description: The EWS acknowledges and sends the result (SubscribeResponse) to header.sender_uri (on-subscribe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - header
                - message
              properties:
                signature:
                  $ref: "#/components/schemas/MsgSignature"
                header:
                  allOf:
                    - $ref: "#/components/schemas/MsgHeader"
                    - type: object
                      properties:
                        action:
                          const: subscribe
                message:
                  type: object
              if:
                properties:
                  header:
                    properties:
                      is_msg_encrypted:
                        const: true
                    required:
                      - is_msg_encrypted
                required:
                  - header
              then:
                properties:
                  message:
                    $ref: "#/components/schemas/EncryptedMessage"
              else:
                properties:
                  message:
                    $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: Acknowledgement (ACK, NACK or ERR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          description: "The request does not conform: ERR acknowledgement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /unsubscribe:
    post:
      tags:
        - Subscription
      summary: Cancel subscriptions
      operationId: unsubscribe
      description: The EWS acknowledges and sends the result (UnSubscribeResponse) to header.sender_uri (on-unsubscribe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - header
                - message
              properties:
                signature:
                  $ref: "#/components/schemas/MsgSignature"
                header:
                  allOf:
                    - $ref: "#/components/schemas/MsgHeader"
                    - type: object
                      properties:
                        action:
                          const: unsubscribe
                message:
                  type: object
              if:
                properties:
                  header:
                    properties:
                      is_msg_encrypted:
                        const: true
                    required:
                      - is_msg_encrypted
                required:
                  - header
              then:
                properties:
                  message:
                    $ref: "#/components/schemas/EncryptedMessage"
              else:
                properties:
                  message:
                    $ref: "#/components/schemas/UnSubscribeRequest"
      responses:
        "200":
          description: Acknowledgement (ACK, NACK or ERR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          description: "The request does not conform: ERR acknowledgement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /on-subscribe:
    post:
      tags:
        - Subscription
      summary: Receive the subscription result (SP side)
      operationId: onSubscribe
      servers:
        - url: https://spmis.example.org
          description: SP system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - header
                - message
              properties:
                signature:
                  $ref: "#/components/schemas/MsgSignature"
                header:
                  allOf:
                    - $ref: "#/components/schemas/MsgHeader"
                    - type: object
                      properties:
                        action:
                          const: on-subscribe
                message:
                  type: object
              if:
                properties:
                  header:
                    properties:
                      is_msg_encrypted:
                        const: true
                    required:
                      - is_msg_encrypted
                required:
                  - header
              then:
                properties:
                  message:
                    $ref: "#/components/schemas/EncryptedMessage"
              else:
                properties:
                  message:
                    $ref: "#/components/schemas/SubscribeResponse"
      responses:
        "200":
          description: Acknowledgement (ACK, NACK or ERR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          description: "The request does not conform: ERR acknowledgement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /on-unsubscribe:
    post:
      tags:
        - Subscription
      summary: Receive the unsubscribe result (SP side)
      operationId: onUnsubscribe
      servers:
        - url: https://spmis.example.org
          description: SP system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - header
                - message
              properties:
                signature:
                  $ref: "#/components/schemas/MsgSignature"
                header:
                  allOf:
                    - $ref: "#/components/schemas/MsgHeader"
                    - type: object
                      properties:
                        action:
                          const: on-unsubscribe
                message:
                  type: object
              if:
                properties:
                  header:
                    properties:
                      is_msg_encrypted:
                        const: true
                    required:
                      - is_msg_encrypted
                required:
                  - header
              then:
                properties:
                  message:
                    $ref: "#/components/schemas/EncryptedMessage"
              else:
                properties:
                  message:
                    $ref: "#/components/schemas/UnSubscribeResponse"
      responses:
        "200":
          description: Acknowledgement (ACK, NACK or ERR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          description: "The request does not conform: ERR acknowledgement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /notify:
    post:
      tags:
        - Notification
      summary: Receive alerts from the EWS (SP side)
      operationId: notify
      description: reg_records are CapAlert or Alert records, as named by reg_record_type. Only status "Actual" may drive action (CD.EWS.03).
      servers:
        - url: https://spmis.example.org
          description: SP system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - header
              properties:
                signature:
                  $ref: "#/components/schemas/MsgSignature"
                header:
                  allOf:
                    - $ref: "#/components/schemas/MsgCallbackHeader"
                    - type: object
                      properties:
                        action:
                          const: notify
                message:
                  type: object
              if:
                properties:
                  header:
                    properties:
                      is_msg_encrypted:
                        const: true
                    required:
                      - is_msg_encrypted
                required:
                  - header
              then:
                properties:
                  message:
                    $ref: "#/components/schemas/EncryptedMessage"
              else:
                properties:
                  message:
                    $ref: "#/components/schemas/NotifyEventRequest"
      responses:
        "200":
          description: Acknowledgement (ACK, NACK or ERR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          description: "The request does not conform: ERR acknowledgement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /collections/alerts:
    get:
      tags:
        - Alerts
      summary: Describe the alerts collection
      operationId: getAlertsCollection
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
  /collections/alerts/items:
    get:
      tags:
        - Alerts
      summary: Fetch alerts, filtered on CAP properties
      operationId: getAlerts
      parameters:
        - name: status
          in: query
          required: false
          description: CAP status of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Actual
              - Exercise
              - System
              - Test
              - Draft
        - name: msg_type
          in: query
          required: false
          description: CAP msg_type of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Alert
              - Update
              - Cancel
              - Ack
              - Error
        - name: scope
          in: query
          required: false
          description: CAP scope of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Public
              - Restricted
              - Private
        - name: threshold_status
          in: query
          required: false
          description: CAP threshold_status of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - NORMAL
              - WATCH
              - CROSSING_THRESHOLD_1
              - TRIGGER
        - name: category
          in: query
          required: false
          description: CAP category of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Geo
              - Met
              - Safety
              - Security
              - Rescue
              - Fire
              - Health
              - Env
              - Transport
              - Infra
              - CBRNE
              - Other
              - GEO
              - MET
              - SAFETY
              - SECURITY
              - RESCUE
              - FIRE
              - HEALTH
              - ENV
              - TRANSPORT
              - INFRA
              - OTHER
        - name: severity
          in: query
          required: false
          description: CAP severity of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Extreme
              - Severe
              - Moderate
              - Minor
              - Unknown
        - name: urgency
          in: query
          required: false
          description: CAP urgency of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Immediate
              - Expected
              - Future
              - Past
              - Unknown
        - name: certainty
          in: query
          required: false
          description: CAP certainty of the alert (or of one of its info blocks)
          schema:
            type: string
            enum:
              - Observed
              - Likely
              - Possible
              - Unlikely
              - Unknown
        - name: event
          in: query
          required: false
          description: CAP event (Info.event), e.g. Flood
          schema:
            type: string
        - name: event_code
          in: query
          required: false
          description: CD.EWS.01 event type (Info.event_code), e.g. FL
          schema:
            type: string
            enum:
              - CW
              - DR
              - EW
              - EP
              - ET
              - FR
              - FF
              - FL
              - HW
              - IN
              - LS
              - MS
              - OT
              - ST
              - AV
              - SS
              - AC
              - TC
              - TS
              - VO
              - WF
        - name: limit
          in: query
          required: false
          description: Maximum number of alerts returned
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Alerts
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
        "400":
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OgcException"
    post:
      tags:
        - Alerts
      summary: Create an alert
      operationId: createAlert
      requestBody:
        required: true
        content:
          application/geo+json:
            schema:
              $ref: "#/components/schemas/Alert"
          application/json:
            schema:
              $ref: "#/components/schemas/Alert"
      responses:
        "201":
          description: Created
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          description: Not a valid Alert Feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OgcException"
  /collections/alerts/items/{alertId}:
    parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: string
        description: Feature id (the CapAlert identifier)
    get:
      tags:
        - Alerts
      summary: Fetch one alert
      operationId: getAlert
      responses:
        "200":
          description: The alert
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Unknown alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OgcException"
    put:
      tags:
        - Alerts
      summary: Replace an alert
      operationId: replaceAlert
      requestBody:
        required: true
        content:
          application/geo+json:
            schema:
              $ref: "#/components/schemas/Alert"
          application/json:
            schema:
              $ref: "#/components/schemas/Alert"
      responses:
        "200":
          description: Replaced
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          description: Not a valid Alert Feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OgcException"
        "404":
          description: Unknown alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OgcException"
  /data/{dataflow}/{key}:
    get:
      tags:
        - Statistics
      summary: Aggregated member statistics (SP side)
      operationId: getMemberStatistics
      description: Counts of registered members by REF_AREA.SEX.DISABILITY_STATUS.AGE_GROUP and TIME_PERIOD (API.EWS.05) or DENOMINATOR_TYPE (sdmx-dci-member-example). "*" is any value, "+" separates values. Counts below the minimum cell count are suppressed (null, CONFIDENTIALITY "C").
      servers:
        - url: https://spmis.example.org
          description: SP system
      parameters:
        - name: dataflow
          in: path
          required: true
          schema:
            type: string
            enum:
              - DCI_MEMBER_STATISTICS
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: AREA001.*.*.ALL.2026
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - sdmx-json
              - dci-json
            default: sdmx-json
      responses:
        "200":
          description: Aggregated statistics
          content:
            application/vnd.sdmx.data+json:
              schema:
                $ref: "#/components/schemas/SdmxJson"
            application/json:
              schema:
                $ref: "#/components/schemas/DciStatistics"
        "400":
          description: Invalid key or format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: Unknown dataflow, or no results for the key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
components:
  schemas:
    DateTime:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z|[+-]([01]\d|2[0-3]):?[0-5]\d)?$
    IsoDate:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z|[+-]([01]\d|2[0-3]):?[0-5]\d)?)?$
    TransactionId:
      type: string
      minLength: 1
      maxLength: 99
    CorrelationId:
      type: string
      minLength: 1
      maxLength: 99
      pattern: ^[a-zA-Z0-9-]+$
    ReferenceId:
      type: string
      minLength: 1
    SubscriptionCode:
      type: string
      minLength: 1
      maxLength: 99
    Locale:
      type: string
      pattern: ^[a-z]{3}$
    RequestStatus:
      type: string
      enum:
        - rcvd
        - pdng
        - succ
        - rjct
    StatusReasonMessage:
      type: string
      maxLength: 999
    Version:
      type: string
      minLength: 1
    RegType:
      type: string
      minLength: 1
    RegRecordType:
      type: string
      pattern: ^([A-Za-z0-9_.-]+:)*(CapAlert|Cap_Alert|Alert)$
    Frequency:
      type: object
      required:
        - start_time
        - end_time
        - frequency
      properties:
        start_time:
          $ref: "#/components/schemas/DateTime"
        end_time:
          $ref: "#/components/schemas/DateTime"
        frequency:
          type: string
          minLength: 1
    MsgSignature:
      type: string
      minLength: 1
    Meta:
      type: object
    MsgHeader:
      type: object
      required:
        - message_id
        - message_ts
        - action
        - sender_id
        - total_count
      properties:
        version:
          $ref: "#/components/schemas/Version"
        message_id:
          type: string
          minLength: 1
        message_ts:
          type: string
          format: date-time
        action:
          type: string
          minLength: 1
        sender_id:
          type: string
          minLength: 1
        sender_uri:
          type: string
          format: uri
        receiver_id:
          type: string
          minLength: 1
        total_count:
          type: integer
          minimum: 0
        is_msg_encrypted:
          type: boolean
        meta:
          $ref: "#/components/schemas/Meta"
    MsgCallbackHeader:
      type: object
      required:
        - message_id
        - message_ts
        - action
        - status
      properties:
        version:
          $ref: "#/components/schemas/Version"
        message_id:
          type: string
          minLength: 1
        message_ts:
          type: string
          format: date-time
        action:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/RequestStatus"
        status_reason_code:
          type: string
          enum:
            - rjct.version.invalid
            - rjct.message_id.duplicate
            - rjct.message_ts.invalid
            - rjct.action.invalid
            - rjct.action.not_supported
            - rjct.total_count.invalid
            - rjct.total_count.limit_exceeded
            - rjct.errors.too_many
        status_reason_message:
          $ref: "#/components/schemas/StatusReasonMessage"
        total_count:
          type: integer
          minimum: 0
        completed_count:
          type: integer
          minimum: 0
        sender_id:
          type: string
          minLength: 1
        receiver_id:
          type: string
          minLength: 1
        is_msg_encrypted:
          type: boolean
        meta:
          $ref: "#/components/schemas/Meta"
    EncryptedMessage:
      type: object
      required:
        - header
        - ciphertext
        - encrypted_key
        - tag
        - iv
      properties:
        header:
          type: object
          required:
            - alg
            - enc
            - kid
          properties:
            alg:
              type: string
              minLength: 1
            enc:
              type: string
              minLength: 1
            kid:
              type: string
              minLength: 1
        ciphertext:
          type: string
          minLength: 1
        encrypted_key:
          type: string
          minLength: 1
        tag:
          type: string
          minLength: 1
        iv:
          type: string
          minLength: 1
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - err.request.bad
            - err.request.unauthorized
            - err.request.forbidden
            - err.request.not_found
            - err.request.timeout
            - err.version.not_supported
            - err.request.too_many_requests
            - err.sender_id.invalid
            - err.sender_uri.invalid
            - err.receiver_id.invalid
            - err.signature.missing
            - err.signature.invalid
            - err.encryption.invalid
            - err.service.unavailable
        message:
          type: string
          maxLength: 999
    GeoCode:
      type: object
      required:
        - valueName
        - value
      properties:
        valueName:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
    Area:
      type: object
      required:
        - areaDesc
      properties:
        areaDesc:
          type: string
          minLength: 1
        polygon:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?(\s+-?\d+(\.\d+)?,-?\d+(\.\d+)?){3,}\s*$
        circle:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^\s*-?\d+(\.\d+)?,-?\d+(\.\d+)?\s+\d+(\.\d+)?\s*$
        geocode:
          anyOf:
            - $ref: "#/components/schemas/GeoCode"
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/GeoCode"
    Resource:
      type: object
      required:
        - resourceDesc
        - mimeType
      properties:
        resourceDesc:
          type: string
          minLength: 1
        mimeType:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]*(/[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]*)?$
        size:
          type: integer
          minimum: 0
        uri:
          type: string
          format: uri-reference
        derefUri:
          type: string
          pattern: ^[A-Za-z0-9+/]+={0,2}$
        digest:
          type: string
          minLength: 1
    Parameter:
      anyOf:
        - type: string
        - $ref: "#/components/schemas/GeoCode"
        - type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GeoCode"
    Category:
      type: string
      enum:
        - Geo
        - Met
        - Safety
        - Security
        - Rescue
        - Fire
        - Health
        - Env
        - Transport
        - Infra
        - CBRNE
        - Other
        - GEO
        - MET
        - SAFETY
        - SECURITY
        - RESCUE
        - FIRE
        - HEALTH
        - ENV
        - TRANSPORT
        - INFRA
        - OTHER
    Info:
      type: object
      required:
        - category
        - event
        - urgency
        - severity
        - certainty
      properties:
        language:
          type: string
          pattern: ^([a-z]{3}|[a-z]{2,3}(-[A-Za-z0-9]{2,8})*)$
        category:
          anyOf:
            - $ref: "#/components/schemas/Category"
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/Category"
        event:
          type: string
          minLength: 1
        response_type:
          anyOf:
            - type: string
              enum:
                - Shelter
                - Evacuate
                - Prepare
                - Execute
                - Avoid
                - Monitor
                - Assess
                - All clear
                - None
            - type: array
              minItems: 1
              items:
                type: string
                enum:
                  - Shelter
                  - Evacuate
                  - Prepare
                  - Execute
                  - Avoid
                  - Monitor
                  - Assess
                  - All clear
                  - None
        urgency:
          type: string
          enum:
            - Immediate
            - Expected
            - Future
            - Past
            - Unknown
        severity:
          type: string
          enum:
            - Extreme
            - Severe
            - Moderate
            - Minor
            - Unknown
        certainty:
          type: string
          enum:
            - Observed
            - Likely
            - Possible
            - Unlikely
            - Unknown
        audience:
          type: string
        effective:
          $ref: "#/components/schemas/DateTime"
        event_code:
          type: string
          minLength: 1
        onset:
          $ref: "#/components/schemas/DateTime"
        expires:
          $ref: "#/components/schemas/DateTime"
        sender_name:
          type: string
        headline:
          type: string
        description:
          type: string
        instruction:
          type: string
        web:
          type: string
          format: uri
        contact:
          type: string
        parameter:
          $ref: "#/components/schemas/Parameter"
        area:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Area"
        resource:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Resource"
        created_at:
          $ref: "#/components/schemas/DateTime"
    CapAlert:
      type: object
      required:
        - identifier
        - sender
        - sent
        - status
        - msg_type
        - scope
        - assessment_date
        - threshold_status
      properties:
        identifier:
          type: string
          pattern: ^[^\s,<&]+$
        sender:
          type: string
          pattern: ^[^\s,<&]+$
        sent:
          $ref: "#/components/schemas/DateTime"
        status:
          type: string
          enum:
            - Actual
            - Exercise
            - System
            - Test
            - Draft
        msg_type:
          type: string
          enum:
            - Alert
            - Update
            - Cancel
            - Ack
            - Error
        source:
          type: string
        scope:
          type: string
          enum:
            - Public
            - Restricted
            - Private
        restriction:
          type: string
          minLength: 1
        addresses:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        code:
          type: string
        assessment_date:
          $ref: "#/components/schemas/DateTime"
        threshold_status:
          type: string
          enum:
            - NORMAL
            - WATCH
            - CROSSING_THRESHOLD_1
            - TRIGGER
        note:
          type: string
        references:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        incidents:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        info:
          type: array
          items:
            $ref: "#/components/schemas/Info"
        created_at:
          $ref: "#/components/schemas/DateTime"
      if:
        properties:
          scope:
            const: Private
        required:
          - scope
      then:
        required:
          - addresses
    Geometry:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
            - MultiPoint
            - LineString
            - MultiLineString
            - Polygon
            - MultiPolygon
        coordinates:
          type: array
        bbox:
          type: array
          items:
            type: number
      allOf:
        - if:
            properties:
              type:
                const: Point
          then:
            properties:
              coordinates:
                type: array
                minItems: 2
                maxItems: 3
                items:
                  type: number
        - if:
            properties:
              type:
                const: Polygon
          then:
            properties:
              coordinates:
                type: array
                minItems: 1
                items:
                  type: array
                  minItems: 4
                  items:
                    type: array
                    minItems: 2
                    maxItems: 3
                    items:
                      type: number
        - if:
            properties:
              type:
                const: MultiPolygon
          then:
            properties:
              coordinates:
                type: array
                minItems: 1
                items:
                  type: array
                  minItems: 1
                  items:
                    type: array
                    minItems: 4
                    items:
                      type: array
                      minItems: 2
                      maxItems: 3
                      items:
                        type: number
    AlertProperties:
      anyOf:
        - $ref: "#/components/schemas/CapAlert"
        - type: object
          required:
            - capAlert
          properties:
            capAlert:
              $ref: "#/components/schemas/CapAlert"
    Alert:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          const: Feature
        id:
          type:
            - string
            - integer
        geometry:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/Geometry"
        properties:
          $ref: "#/components/schemas/AlertProperties"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    Link:
      type: object
